<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="agy-subagent: Claude Code hands tasks to parallel Google Antigravity agy workers">
  <title>agy-subagent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .rise { opacity: 0; animation: rise .8s ease-out forwards; }
    .r2 { animation-delay: .25s; } .r3 { animation-delay: .5s; } .r4 { animation-delay: .75s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .flow { stroke-dasharray: 6 8; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .glow { animation: breathe 3s ease-in-out infinite; transform-origin: 595px 150px; }
    @keyframes breathe { 0%, 100% { opacity: .6; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.05); } }
    .run, .done { animation: 6s linear infinite; }
    .run { animation-name: run; } .done { animation-name: done; }
    .w2 { animation-delay: -2s; } .w3 { animation-delay: -4s; }
    @keyframes run { 0%, 64% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes done { 0%, 64% { opacity: 0; } 66%, 100% { opacity: 1; } }
    .dot { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise { opacity: 1; }
      .done { opacity: 0; }
    }
  </style>

  <rect width="960" height="300" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="959" height="299" rx="16" fill="none" stroke="#30363d"/>

  <!-- left: name and pitch -->
  <text class="sans rise" x="48" y="112" font-size="46" font-weight="700" fill="url(#accent)">agy-subagent</text>
  <text class="sans rise r2" x="50" y="152" font-size="18" fill="#c9d1d9">Fan out work from Claude Code to parallel</text>
  <text class="sans rise r2" x="50" y="178" font-size="18" fill="#c9d1d9">Google Antigravity (agy) workers. Watch them live.</text>
  <g class="mono rise r3" font-size="13">
    <rect x="50" y="210" width="86" height="28" rx="14" fill="#1f2937" stroke="#374151"/>
    <text x="93" y="229" text-anchor="middle" fill="#a78bfa">parallel</text>
    <rect x="146" y="210" width="96" height="28" rx="14" fill="#1f2937" stroke="#374151"/>
    <text x="194" y="229" text-anchor="middle" fill="#39c5cf">sandboxed</text>
    <rect x="252" y="210" width="96" height="28" rx="14" fill="#1f2937" stroke="#374151"/>
    <text x="300" y="229" text-anchor="middle" fill="#3fb950">live TUI</text>
    <rect x="358" y="210" width="110" height="28" rx="14" fill="#1f2937" stroke="#374151"/>
    <text x="413" y="229" text-anchor="middle" fill="#d29922">plain reports</text>
  </g>

  <!-- right: orchestrator fanning out to workers -->
  <circle class="glow" cx="595" cy="150" r="90" fill="url(#glow)"/>
  <g fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round">
    <path class="flow" d="M672 150 C 715 150, 715 66, 758 66"/>
    <path class="flow" d="M672 150 L 758 150"/>
    <path class="flow" d="M672 150 C 715 150, 715 234, 758 234"/>
  </g>
  <g class="rise r3">
    <rect x="520" y="112" width="152" height="76" rx="12" fill="#161b22" stroke="#7c5cff" stroke-width="1.5"/>
    <text class="sans" x="596" y="146" text-anchor="middle" font-size="17" font-weight="600" fill="#f0f6fc">Claude Code</text>
    <text class="mono" x="596" y="168" text-anchor="middle" font-size="12" fill="#8b949e">orchestrator</text>
  </g>

  <g class="mono rise r4" font-size="13">
    <!-- worker 1 -->
    <rect x="758" y="40" width="172" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="774" y="62" fill="#f0f6fc">agy · backend</text>
    <g class="run"><circle class="dot" cx="779" cy="77" r="4" fill="#39c5cf"/><text x="790" y="81" font-size="11" fill="#39c5cf">RUNNING</text></g>
    <g class="done"><text x="774" y="81" font-size="11" fill="#3fb950">✔ DONE</text></g>
    <!-- worker 2 -->
    <rect x="758" y="124" width="172" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="774" y="146" fill="#f0f6fc">agy · auth-review</text>
    <g class="run w2"><circle class="dot" cx="779" cy="161" r="4" fill="#39c5cf"/><text x="790" y="165" font-size="11" fill="#39c5cf">RUNNING</text></g>
    <g class="done w2"><text x="774" y="165" font-size="11" fill="#3fb950">✔ DONE</text></g>
    <!-- worker 3 -->
    <rect x="758" y="208" width="172" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="774" y="230" fill="#f0f6fc">agy · api-tests</text>
    <g class="run w3"><circle class="dot" cx="779" cy="245" r="4" fill="#39c5cf"/><text x="790" y="249" font-size="11" fill="#39c5cf">RUNNING</text></g>
    <g class="done w3"><text x="774" y="249" font-size="11" fill="#3fb950">✔ DONE</text></g>
  </g>
</svg>
