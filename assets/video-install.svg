<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Installation video: coming soon">
  <title>Installation video (coming soon)</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ring { animation: ring 2.4s ease-out infinite; transform-origin: 400px 200px; }
    @keyframes ring { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.8); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0; } }
