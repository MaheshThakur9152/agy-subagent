  <rect width="800" height="450" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="798" height="448" rx="15" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-width="2" stroke-dasharray="10 8"/>
  <circle class="ring" cx="400" cy="200" r="46" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="400" cy="200" r="46" fill="#161b22" stroke="#a78bfa" stroke-width="3"/>
  <path d="M388 178 L388 222 L424 200 Z" fill="#a78bfa"/>
  <text x="400" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#f0f6fc">Installation video</text>
  <text x="400" y="332" text-anchor="middle" font-size="16" fill="#8b949e">Install agy-subagent in under a minute</text>
